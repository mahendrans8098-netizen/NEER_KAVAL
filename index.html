<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>நீர் காவல் — NEERKAVAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+Tamil:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --teal-900:#083942; --teal-700:#0B5D6B; --teal-600:#116E7E; --teal-100:#E4F2F1;
  --ink:#122B30; --ink-soft:#3E5B60;
  --paper:#FAFAF8; --paper-raised:#FFFFFF; --line:#D8E4E2;
  --safe:#1E8E5A; --safe-bg:#E7F6EE;
  --caution:#B8860B; --caution-bg:#FFF6DD;
  --warn:#C15A0E; --warn-bg:#FFEEE0;
  --high:#C62828; --high-bg:#FDE7E7;
  --critical:#7A0C0C; --critical-bg:#3A0808; --critical-fg:#FFF3F3;
  --focus:#0B5D6B;
  --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-latin:'Inter',system-ui,sans-serif;
  --font-ta:'Noto Sans Tamil','Inter',system-ui,sans-serif;
  --font-hi:'Noto Sans Devanagari','Inter',system-ui,sans-serif;
  --sat-top:env(safe-area-inset-top,0px);
  --sat-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --paper:#0E1B1D; --paper-raised:#152A2D; --line:#263E41; --ink:#EAF3F2; --ink-soft:#AFC7C6; --teal-100:#12363A;
}
*{box-sizing:border-box;}
html{scroll-padding-top:var(--sat-top);}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-ta); line-height:1.45;
  padding-top:var(--sat-top); padding-bottom:var(--sat-bottom);
  -webkit-tap-highlight-color:transparent;
}
body[data-lang="en"]{font-family:var(--font-latin);}
body[data-lang="hi"]{font-family:var(--font-hi);}
h1,h2,h3{margin:0; font-weight:800; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px;}
@media (prefers-contrast:more){
  :root{--line:#1a1a1a;}
  .card{border-width:2px !important;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ============ LAYOUT SHELL ============ */
#app{min-height:100%;display:flex;flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:40; background:var(--teal-900); color:#fff;
  padding:calc(10px + var(--sat-top)) 14px 10px; display:flex; align-items:center; gap:10px;
}
.topbar .brand{display:flex; align-items:baseline; gap:8px; flex:1; min-width:0;}
.topbar .brand h1{font-size:20px; color:#fff;}
.topbar .brand small{opacity:.8; font-size:11px; font-family:var(--font-latin);}
.langswitch{display:flex; background:rgba(255,255,255,.12); border-radius:999px; padding:3px; gap:2px;}
.langswitch button{border:0; background:transparent; color:#fff; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer;}
.langswitch button[aria-pressed="true"]{background:#fff; color:var(--teal-900);}
.modebtn{border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.08); color:#fff; border-radius:999px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;}

main{flex:1; width:100%; max-width:1180px; margin:0 auto; padding:14px 14px 96px; display:flex; gap:20px;}
.sidebar{display:none;}
.content{flex:1; min-width:0; display:flex; flex-direction:column; gap:16px;}

.bottomnav{
  position:fixed; bottom:0; left:0; right:0; z-index:50; background:var(--paper-raised);
  border-top:1px solid var(--line); display:flex; padding:6px calc(4px + var(--sat-bottom)/2) calc(6px + var(--sat-bottom));
  box-shadow:0 -2px 10px rgba(0,0,0,.06);
}
.bottomnav button{flex:1; border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:12px; cursor:pointer; color:var(--ink-soft); font-size:11px; font-weight:700;}
.bottomnav button .ic{font-size:20px;}
.bottomnav button[aria-current="true"]{color:var(--teal-700); background:var(--teal-100);}

.sosfab{
  position:fixed; right:14px; bottom:calc(78px + var(--sat-bottom)); z-index:55;
  width:64px; height:64px; border-radius:50%; border:0; cursor:pointer;
  background:var(--high); color:#fff; font-weight:800; font-size:13px; box-shadow:0 6px 16px rgba(198,40,40,.45);
}

/* ============ CARDS / COMMON ============ */
.card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px;}
.card h2{font-size:15px; color:var(--ink-soft); text-transform:none; margin-bottom:10px;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--teal-100); color:var(--teal-700); font-family:var(--font-latin); letter-spacing:.02em;}
.pill.demo{background:#FFF0D6; color:#8A5A00;}
.pill.ok{background:var(--safe-bg); color:var(--safe);}
.pill.bad{background:var(--high-bg); color:var(--high);}

.status-card{border-radius:var(--radius-l); padding:20px; color:#fff; display:flex; flex-direction:column; gap:12px;}
.status-card.level-normal{background:linear-gradient(135deg,var(--safe),#146342);}
.status-card.level-caution{background:linear-gradient(135deg,#C79A1E,#8A6B00); color:#241C00;}
.status-card.level-warning{background:linear-gradient(135deg,var(--warn),#8A3B06);}
.status-card.level-high{background:linear-gradient(135deg,var(--high),#7A1414);}
.status-card.level-critical{background:repeating-linear-gradient(135deg,var(--critical-bg),var(--critical-bg) 14px,#560606 14px,#560606 28px); color:var(--critical-fg); animation:pulseCrit 1.8s infinite;}
@keyframes pulseCrit{0%,100%{box-shadow:0 0 0 0 rgba(122,12,12,.5);}50%{box-shadow:0 0 0 10px rgba(122,12,12,0);}}
.status-top{display:flex; align-items:center; gap:12px;}
.status-emoji{font-size:38px; line-height:1;}
.status-title{font-size:22px; font-weight:800;}
.status-sub{font-size:14px; opacity:.95;}

.bigbtn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.bigbtn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:16px 8px; min-height:88px; border-radius:var(--radius-m); border:1px solid var(--line);
  background:var(--paper-raised); cursor:pointer; font-weight:700; font-size:13px; color:var(--ink); text-align:center;
}
.bigbtn .ic{font-size:26px;}
.bigbtn.primary{background:var(--teal-700); color:#fff; border-color:var(--teal-700);}
.bigbtn.danger{background:var(--high); color:#fff; border-color:var(--high);}
.bigbtn.wide{grid-column:1/-1;}

.barchart{display:flex; flex-direction:column; gap:10px;}
.barrow .lbl{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:4px;}
.barrow .track{height:12px; border-radius:999px; background:var(--line); overflow:hidden;}
.barrow .fill{height:100%; border-radius:999px; background:var(--teal-700); transition:width .6s ease;}
.barrow .fill.high{background:var(--high);}
.barrow .fill.med{background:var(--caution);}
.barrow .fill.low{background:var(--safe);}

.segmented{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--paper);}
.segmented button{border:0; background:transparent; padding:7px 14px; border-radius:999px; font-weight:700; font-size:12px; cursor:pointer; color:var(--ink-soft);}
.segmented button[aria-pressed="true"]{background:var(--teal-700); color:#fff;}

.scenariobar{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch;}
.scenariobar::-webkit-scrollbar{height:5px;}
.scenariochip{flex:none; border:1px solid var(--line); background:var(--paper-raised); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;}
.scenariochip[aria-pressed="true"]{background:var(--teal-900); color:#fff; border-color:var(--teal-900);}

#map{width:100%; height:280px; border-radius:var(--radius-m); border:1px solid var(--line); z-index:0;}
.maplegend{display:flex; flex-wrap:wrap; gap:8px; font-size:11px; font-weight:700; margin-top:8px;}
.maplegend span{display:inline-flex; align-items:center; gap:4px;}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block;}

.shelter-card{border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; display:flex; flex-direction:column; gap:8px;}
.shelter-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.shelter-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; font-size:12px;}
.shelter-stats div{background:var(--paper); border-radius:8px; padding:6px 8px; text-align:center;}
.shelter-stats b{display:block; font-size:15px;}
.shelter-tags{display:flex; gap:6px; flex-wrap:wrap; font-size:11px;}
.tag{background:var(--teal-100); color:var(--teal-700); padding:3px 8px; border-radius:999px; font-weight:700;}
.tag.off{background:#EFEFEF; color:#8A8A8A;}
.shelter-actions{display:flex; gap:8px;}
.btn-sm{flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--paper); font-weight:700; font-size:12px; cursor:pointer;}
.btn-sm.primary{background:var(--teal-700); color:#fff; border-color:var(--teal-700);}

.sos-need-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0;}
.sos-need{border:2px solid var(--line); border-radius:var(--radius-m); padding:14px; text-align:center; font-weight:700; cursor:pointer; background:var(--paper-raised);}
.sos-need[aria-pressed="true"]{border-color:var(--high); background:var(--high-bg); color:var(--high);}
.sos-timeline{display:flex; flex-direction:column; gap:0;}
.sos-step{display:flex; gap:12px; padding:10px 0; opacity:.4;}
.sos-step.active{opacity:1;}
.sos-step .node{width:26px; height:26px; border-radius:50%; background:var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; flex:none;}
.sos-step.active .node{background:var(--teal-700); color:#fff;}
.sos-step.done .node{background:var(--safe); color:#fff;}
.sos-step .txt b{display:block; font-size:13px;}
.sos-step .txt span{font-size:12px; color:var(--ink-soft);}

.status-table{width:100%; border-collapse:collapse; font-size:13px;}
.status-table td{padding:9px 4px; border-bottom:1px solid var(--line);}
.status-table td:last-child{text-align:right;}

.gsmbox{background:var(--ink); color:#B7F7C8; font-family:monospace; padding:12px; border-radius:10px; font-size:12.5px; white-space:pre-wrap; word-break:break-all;}

.timeline-track{display:flex; gap:6px; overflow-x:auto; padding:8px 0;}
.timeline-node{flex:none; text-align:center; min-width:74px; font-size:11px; font-weight:700; color:var(--ink-soft);}
.timeline-node .dot2{width:12px; height:12px; border-radius:50%; background:var(--line); margin:0 auto 4px;}
.timeline-node.active{color:var(--teal-700);}
.timeline-node.active .dot2{background:var(--teal-700);}
.timeline-node.done .dot2{background:var(--safe);}

.officer-grid{display:grid; grid-template-columns:1fr; gap:14px;}
.incident-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;}

.banner{border-radius:var(--radius-m); padding:12px 14px; font-size:13px; font-weight:700; display:flex; gap:8px; align-items:center;}
.banner.offline{background:#3A2E00; color:#FFE49E;}
.banner.info{background:var(--teal-100); color:var(--teal-700);}

.formgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.report-opt{border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; font-weight:700; font-size:13px; cursor:pointer; background:var(--paper-raised);}
.report-opt[aria-pressed="true"]{background:var(--teal-100); border-color:var(--teal-700); color:var(--teal-700);}

.voicebar{position:sticky; bottom:0; z-index:20;}
.small{font-size:12px; color:var(--ink-soft);}
.hidden{display:none !important;}
.screen{display:flex; flex-direction:column; gap:16px;}
.slider{width:100%;}

/* ============ MOBILE FIRST BASE RULES ARE ABOVE. TABLET / DESKTOP OVERRIDES BELOW ============ */
@media (max-width:480px){
  .bigbtn-grid{grid-template-columns:1fr 1fr;}
  .status-title{font-size:19px;}
}
@media (max-width:600px){
  main{padding-bottom:100px;}
}
@media (min-width:601px) and (max-width:1024px){
  .bigbtn-grid{grid-template-columns:repeat(3,1fr);}
  .shelter-stats{grid-template-columns:repeat(3,1fr);}
}
@media (min-width:1025px){
  .bottomnav,.sosfab{display:none;}
  main{padding:24px 24px 40px; gap:26px;}
  .sidebar{
    display:flex; flex-direction:column; gap:4px; width:230px; flex:none;
    position:sticky; top:calc(64px + var(--sat-top)); align-self:flex-start;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:10px;
  }
  .sidebar button{display:flex; align-items:center; gap:10px; border:0; background:transparent; padding:11px 12px; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer; color:var(--ink-soft); text-align:left;}
  .sidebar button[aria-current="true"]{background:var(--teal-100); color:var(--teal-700);}
  .bigbtn-grid{grid-template-columns:repeat(4,1fr);}
  #map{height:420px;}
  .officer-grid{grid-template-columns:1.3fr 1fr;}
}
@media (orientation:landscape) and (max-width:900px){
  .bottomnav button .ic{font-size:16px;}
}
</style>
</head>

function renderShell(){
  document.body.setAttribute('data-lang',STATE.lang);
  document.getElementById('brandTitle').textContent=T("brand");
  document.querySelectorAll('.langswitch button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===STATE.lang));
  const modeBtn=document.getElementById('modeToggle');
  modeBtn.textContent = STATE.officer? T("switch_to_public") : T("switch_to_officer");

  const navSet = STATE.officer? OFFICER_NAV : NAV;
  const bottom=document.getElementById('bottomNav');
  bottom.innerHTML="";
  navSet.forEach(n=>{
    const b=document.createElement('button');
    b.type="button"; b.setAttribute('aria-current', STATE.screen===n.id);
    b.innerHTML=`<span class="ic">${n.ic}</span><span>${T(n.labelKey)}</span>`;
    b.onclick=()=>{STATE.screen=n.id; render();};
    bottom.appendChild(b);
  });
  const sidebar=document.getElementById('sidebarNav');
  sidebar.innerHTML="";
  const sideSet = STATE.officer? OFFICER_NAV.concat({id:"shelter",ic:"🏘️",labelKey:"nav_shelter"},{id:"offline",ic:"📴",labelKey:"nav_offline"}) : NAV.concat(NAV_MORE);
  sideSet.forEach(n=>{
    const b=document.createElement('button');
    b.type="button"; b.setAttribute('aria-current', STATE.screen===n.id);
    b.innerHTML=`<span>${n.ic}</span><span>${T(n.labelKey)}</span>`;
    b.onclick=()=>{STATE.screen=n.id; render();};
    sidebar.appendChild(b);
  });
  document.getElementById('sosFab').onclick=()=>{STATE.screen='sos'; render();};
  document.getElementById('sosFab').classList.toggle('hidden', STATE.officer);
}

function zoneColor(t){return {safe:"#1E8E5A",caution:"#B8860B",warn:"#C15A0E",flood:"#C62828",critical:"#7A0C0C"}[t];}
function buildMap(){
  const el=document.getElementById('map'); if(!el || typeof L==='undefined') return;
  const s=scen();
  if(!STATE.map){
    STATE.map=L.map('map',{zoomControl:true}).setView(s.center,13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap'}).addTo(STATE.map);
    STATE.layerGroup=L.layerGroup().addTo(STATE.map);
  } else {
    STATE.map.setView(s.center,13);
    STATE.layerGroup.clearLayers();
  }
  s.zones.forEach(z=>{
    L.circle(z.pos,{radius:z.r,color:zoneColor(z.type),fillColor:zoneColor(z.type),fillOpacity:0.28,weight:2}).addTo(STATE.layerGroup);
  });
  s.roads.forEach(r=>{
    L.polyline([r.from,r.to],{color:r.blocked?'#7A0C0C':'#1E8E5A',weight:5,dashArray:r.blocked?'2,10':null}).addTo(STATE.layerGroup)
      .bindPopup(r.blocked?('🚧 '+T("legend_blocked")):('✅ '+T("legend_route")));
  });
  s.shelters.forEach(sh=>{
    L.marker(sh.pos,{title:sh.name[STATE.lang]}).addTo(STATE.layerGroup).bindPopup(`🏠 ${sh.name[STATE.lang]} — ${T("available")}: ${sh.cap-sh.occ}`);
  });
  const safeRoad=s.roads.find(r=>!r.blocked);
  if(safeRoad){
    L.polyline([s.center,safeRoad.to],{color:'#0B5D6B',weight:4,dashArray:'8,6'}).addTo(STATE.layerGroup);
  }
  L.circleMarker(s.center,{radius:8,color:'#0B5D6B',fillColor:'#0B5D6B',fillOpacity:1}).addTo(STATE.layerGroup).bindPopup('📍 You');
  setTimeout(()=>STATE.map.invalidateSize(),80);
}

    </div>
    ${s.needAlert? `<div class="card">
      <h2>${riskLabel(s.risk)} → ${T("simulated")}</h2>
      <div class="timeline-track">
        ${["CRITICAL RISK","OFFICER","ALERT SERVICE","SMS/WA/GSM","DELIVERY"].map((t,i)=>`<div class="timeline-node done"><div class="dot2"></div>${t}</div>`).join("")}
      </div>
      <div class="small">SIMULATED DELIVERY — ${T("demo_label")}</div>
    </div>`:""}
    ${renderScenarioBar()}
  </div>`;
}

/* ---------------- Screen: Offline ---------------- */
function screenOffline(){
  const off=!isOnline();
  return `<div class="screen">
    <div class="card">
      <h2>📴 ${T("offline_title")}</h2>
      <button class="bigbtn ${off?'primary':''}" style="width:100%;" onclick="toggleInternet()">${off? T("simulate_on") : T("simulate_off")}</button>
      <table class="status-table" style="margin-top:12px;">
        <tr><td>🌐 ${T("nav_offline")}</td><td>${off?"🔴 OFFLINE":"🟢 ONLINE"}</td></tr>
        <tr><td>🛰️ GPS</td><td>🟢 AVAILABLE</td></tr>
        <tr><td>🗺️ ${T("nav_map")}</td><td>🟢 ${off?"CACHED":"LIVE"}</td></tr>
        <tr><td>🏠 ${T("shelter_title")}</td><td>🟢 ${off?"CACHED":"LIVE"}</td></tr>
        <tr><td>ℹ️ Safety info</td><td>🟢 AVAILABLE</td></tr>
        <tr><td>${T("last_sync")}</td><td>10:35 AM</td></tr>
      </table>
    </div>
    <div class="card">
      <h2>${T("cache_radius")} <span class="pill demo">SIMULATED OFFLINE CACHE</span></h2>
      <div class="row">
        ${[5,10,20,30].map(km=>`<button class="scenariochip" aria-pressed="${STATE.cacheRadius===km}" onclick="setCacheRadius(${km})">${km} km</button>`).join("")}
      </div>
      <div class="pill ok" style="margin-top:10px;">✓ ${T("cache_ready")}</div>
    </div>
    ${renderScenarioBar()}
  </div>`;
}

/* ---------------- Screen: Report ---------------- */
const REPORT_OPTS=[
 {id:"flooded",ic:"🌊",labelKey:"rep_flooded"},{id:"bridge",ic:"🌉",labelKey:"rep_bridge"},
 {id:"trapped",ic:"🏠",labelKey:"rep_trapped"},{id:"blocked",ic:"🚧",labelKey:"rep_blocked"},
 {id:"rising",ic:"💧",labelKey:"rep_rising"},{id:"other",ic:"📍",labelKey:"rep_other"},
];
function screenReport(){
  return `<div class="screen">
    <div class="card">
      <h2>📝 ${T("report_title")}</h2>
      <div class="formgrid">
        ${REPORT_OPTS.map(o=>`<div class="report-opt" role="button" tabindex="0" aria-pressed="${STATE.reportOpt===o.id}" onclick="selectReport('${o.id}')">${o.ic} ${T(o.labelKey)}</div>`).join("")}
      </div>
      <button class="bigbtn primary wide" style="margin-top:12px;" ${STATE.reportOpt?"":"disabled"} onclick="submitReport()">${T("submit_report")}</button>
      ${STATE.reportSubmitted? `<div class="banner info" style="margin-top:12px;">✅ ${T("report_created")} — ${T("simulated")}</div>`:""}
    </div>
  </div>`;
}

/* ---------------- Screen: Officer ---------------- */
function screenOfficer(){
  const s=scen();
  return `<div class="screen">
    <div class="card">
      <h2>👮 ${T("officer_dash")} <span class="pill demo">${T("demo_label")}</span></h2>
      <div class="small" style="margin-bottom:6px;">${T("scenario_ctrl")}</div>
      <select onchange="setScenario(this.value)" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);font-weight:700;">
        ${SCENARIO_ORDER.map(k=>`<option value="${k}" ${k===STATE.scenarioKey?"selected":""}>${SCENARIOS[k].name[STATE.lang]}</option>`).join("")}
      </select>
    </div>
    <div class="officer-grid">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="card">
          <h2>${T("incidents")}</h2>
          <div class="incident-row"><span>${riskEmoji(s.risk)} ${s.area[STATE.lang]}</span><b>${riskLabel(s.risk)}</b></div>
          <div class="incident-row"><span>🚧 ${T("legend_blocked")}</span><b>${s.roads.filter(r=>r.blocked).length}</b></div>
          <div class="incident-row"><span>🏠 ${T("shelter_title")}</span><b>${s.shelters.length}</b></div>
        </div>
        <div class="card">
          <h2>${T("rescue_teams")} <span class="pill demo">SIMULATION</span></h2>
          ${RESCUE_TEAMS.map(t=>`<div class="incident-row"><span>🚤 ${t.id}</span><b>${t.status} · ${t.dist}km</b></div>`).join("")}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="card">
          <h2>${T("system_status")}</h2>
          <table class="status-table">
            <tr><td>${T("weather_title")}</td><td>🟢 DEMO READY</td></tr>
            <tr><td>${T("risk_title")}</td><td>🟢 DEMO READY</td></tr>
            <tr><td>XAI</td><td>🟢 DEMO READY</td></tr>
            <tr><td>GIS</td><td>🟢 DEMO READY</td></tr>
            <tr><td>${T("shelter_title")}</td><td>🟢 DEMO READY</td></tr>
            <tr><td>${T("sms")}</td><td>🟡 SIMULATION</td></tr>
            <tr><td>${T("whatsapp")}</td><td>🟡 SIMULATION</td></tr>
            <tr><td>${T("nav_offline")} Cache</td><td>🟢 SIMULATION</td></tr>
            <tr><td>${T("gsm")}</td><td>🟡 SIMULATION</td></tr>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------------- Router ---------------- */
function goScreen(id){STATE.screen=id; render();}
function setScenario(k){STATE.scenarioKey=k; STATE.sos={step:0,need:null,acknowledged:false}; render();}
function setDetail(v){STATE.detailMode=v; render();}
function selectNeed(id){STATE.sos.need=id; render();}
function sendSos(){STATE.sos.step=1; render(); setTimeout(()=>{STATE.sos.step=2; render();},900); setTimeout(()=>{STATE.sos.step=3; render();},2200);}
function advanceSos(){if(STATE.sos.step<5){STATE.sos.step++; render();}}
function resetSos(){STATE.sos={step:0,need:null,acknowledged:false}; render();}
function toggleInternet(){STATE.internetOverride = isOnline()? false : true; render();}
function setCacheRadius(km){STATE.cacheRadius=km; render();}
function selectReport(id){STATE.reportOpt=id; render();}
function submitReport(){STATE.reportSubmitted=true; render();}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=SPEECH_LANG[STATE.lang];
  window.speechSynthesis.speak(u);
}
function speakCurrent(){
  const s=scen();
  const text = STATE.lang==='ta'
   ? `${riskLabel(s.risk)}. ${s.weather.forecast.ta}. ${T("btn_safety")}.`
   : STATE.lang==='hi'
   ? `${riskLabel(s.risk)}. ${s.weather.forecast.hi}. ${T("btn_safety")}.`
   : `${riskLabel(s.risk)}. ${s.weather.forecast.en}. ${T("btn_safety")}.`;
  speak(text);
}

/* ---------------- Main render ---------------- */
function render(){
  renderShell();
  const c=document.getElementById('content');
  let html="";
  const screen = STATE.officer && STATE.screen==='home' ? 'officer' : STATE.screen;
  switch(screen){
    case 'home': html=screenHome(); break;
    case 'weather': html=screenWeather(); break;
    case 'risk': html=screenRisk(); break;
    case 'map': html=screenMap(); break;
    case 'shelter': html=screenShelter(); break;
    case 'sos': html=screenSos(); break;
    case 'alerts': html=screenAlerts(); break;
    case 'offline': html=screenOffline(); break;
    case 'report': html=screenReport(); break;
    case 'officer': html=screenOfficer(); break;
    default: html=screenHome();
  }
  c.innerHTML=html;
  if(screen==='map') buildMap();
}

document.querySelectorAll('.langswitch button').forEach(b=>{
  b.addEventListener('click',()=>{STATE.lang=b.dataset.lang; render();});
});
document.getElementById('modeToggle').addEventListener('click',()=>{
  STATE.officer=!STATE.officer; STATE.screen= STATE.officer? 'officer':'home'; render();
});

if(!STATE.officer) STATE.screen='home';
render();
</script>
</body>
</html>
